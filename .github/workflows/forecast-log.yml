name: Log forecast verification

on:
  schedule:
    # 18:35 UTC = 00:05 IST — just after the Kolkata calendar day rolls over,
    # so "yesterday" is complete when we fetch it.
    - cron: "35 18 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: node scripts/log_forecast.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/forecast_log.json
          git diff --cached --quiet || git commit -m "Log forecast verification $(date -u +%Y-%m-%d)"
          git push
